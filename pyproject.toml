[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gainmap-audit"
version = "0.1.0"
description = "Find photos whose HDR gain map was lost in an editing round trip"
readme = "README.md"
license = "MIT"
authors = [{ name = "Chris Bosch", email = "cbosch101@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "hdr",
    "gain-map",
    "ultrahdr",
    "jpeg",
    "heic",
    "avif",
    "metadata",
    "photography",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Booyaka101/gainmap-audit"
Repository = "https://github.com/Booyaka101/gainmap-audit"
Changelog = "https://github.com/Booyaka101/gainmap-audit/blob/main/CHANGELOG.md"
Issues = "https://github.com/Booyaka101/gainmap-audit/issues"

[project.scripts]
gmaudit = "gainmap_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gainmap_audit"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
